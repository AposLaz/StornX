{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "service.name" . }}-leader
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [stornx-optiscaler]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "service.name" . }}-leader
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "service.name" . }}-leader}
subjects:
  - {kind: ServiceAccount, name: {{ include "service.name" . }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "service.name" . }}-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "service.name" . }}-nodes
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Namespace }}-{{ include "service.name" . }}-nodes}
subjects:
  - {kind: ServiceAccount, name: {{ include "service.name" . }}, namespace: {{ .Release.Namespace }}}
{{- range $namespace := .Values.config.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Namespace }}-{{ include "service.name" $ }}
  namespace: {{ $namespace }}
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Namespace }}-{{ include "service.name" $ }}
  namespace: {{ $namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $.Release.Namespace }}-{{ include "service.name" $ }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "service.name" $ }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
