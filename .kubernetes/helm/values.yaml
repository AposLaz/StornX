# Default values for StornX Helm chart
# This is a YAML-formatted file.

# -- Number of replicas
replicaCount: 1

# -- Application image configuration
image:
  repository: alazidis/stornx
  pullPolicy: Always
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "latest"

# -- Image pull secrets for private registries
imagePullSecrets:
  - name: regcred

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

# -- Namespace to deploy StornX (will be created if doesn't exist)
namespace: stornx

# =============================================================================
# Application Configuration
# =============================================================================
config:
  # -- Environment mode (production, development, staging)
  env: production
  
  # -- Application port
  appPort: 3000
  
  # -- Comma-separated list of namespaces to monitor
  namespaces: "online-boutique"
  
  # -- Prometheus URL for metrics collection
  prometheusUrl: "http://prometheus.istio-system.svc.cluster.local:9090"
  
  # -- Cron expression for scheduling optimization jobs
  cronjobExpression: "* * * * *"
  # -- Cron for scraping locality labels (used by fault tolerance)
  localityLabelsCron: "* * * * *"
  
  # -- Type of metrics to use for scaling decisions (cpu, memory)
  metricsType: "memory"
  
  # -- Upper threshold percentage for scaling up
  metricsUpperThreshold: "70"
  
  # -- Lower threshold percentage for scaling down
  metricsLowerThreshold: "20"
  responseTimeThreshold: "100"
  cpuWeight: "50"
  memoryWeight: "50"

  # -- OptiBalancer tuning parameters
  # -- OptiBalancer tuning parameters
  # These tune traffic shifting behavior. Leave the defaults if you are unsure.
  # Changing these values affects how aggressively traffic is moved between
  # destinations; only modify when you understand the tradeoffs.
  balancer:
    minDelta: "5"
    minStepSize: "5"
    maxStepSize: "20"
    urgencyThreshold: "50"
    epsilon: "1"

  # -- Fault tolerance settings
  faultTolerance:
    ftMaxZones: "3"

# -- Additional environment variables
extraEnv: []
#  - name: CUSTOM_VAR
#    value: "custom-value"
#  - name: SECRET_VAR
#    valueFrom:
#      secretKeyRef:
#        name: my-secret
#        key: secret-key

# =============================================================================
# Service Account & RBAC
# =============================================================================
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: "stornx-sa"

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true
  # -- Name for the ClusterRole
  clusterRoleName: "stornx-role"
  # -- Name for the ClusterRoleBinding
  clusterRoleBindingName: "stornx-binding"

# =============================================================================
# Pod Configuration
# =============================================================================
podAnnotations: {}
#  prometheus.io/scrape: "true"
#  prometheus.io/port: "3000"

podLabels: {}

podSecurityContext: {}
#  fsGroup: 2000

securityContext: {}
#  capabilities:
#    drop:
#      - ALL
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
#  runAsUser: 1000

# =============================================================================
# Resource Management
# =============================================================================
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# =============================================================================
# Health Probes
# =============================================================================
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

# =============================================================================
# Persistent Volume Claim
# =============================================================================
persistence:
  enabled: false
  # -- Storage class for PVC
  storageClassName: ""
  # -- Access modes for PVC
  accessModes:
    - ReadWriteOnce
  # -- Size of PVC
  size: 1Gi
  # -- Annotations for PVC
  annotations: {}
  # -- Mount path in the container
  mountPath: /data
  # -- Existing PVC name (if using an existing PVC)
  existingClaim: ""

# =============================================================================
# Additional Volumes
# =============================================================================
volumes: []
#  - name: config
#    configMap:
#      name: stornx-config

volumeMounts: []
#  - name: config
#    mountPath: /app/config
#    readOnly: true


# =============================================================================
# Dependencies Configuration
# =============================================================================

kube-netlag:
  enabled: true
  imagePullSecrets:
    - name: "regcred"
  nameOverride: "kube-netlag"
      
prometheus:
  enabled: true
  imagePullSecrets:
    - name: "regcred"
  server:
    name: server
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
    extraConfigmapMounts:
      - name: kube-netlag
        mountPath: /etc/config/kube-netlag
        configMap: kube-netlag
        readOnly: true
    
    # fullnameOverride: "prometheus"
    
    persistentVolume:
      enabled: true
      mountPath: /data
      size: 8Gi
    replicaCount: 1
    retention: "15d"

  extraScrapeConfigs: |-
    - job_name: 'istiod'
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
          - istio-system
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: istiod;http-monitoring
    - job_name: 'envoy-stats'
      metrics_path: /stats/prometheus
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: '.*-envoy-prom'
  scrapeConfigFiles:
    - /etc/config/kube-netlag/kube-netlag.yaml
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false

istiod:
  enabled: true
  _internal_defaults_do_not_set:
    autoscaleEnabled: true
    global:
      istioNamespace: stornx
      # A minimal set of requested resources to applied to all deployments so that
      # Horizontal Pod Autoscaler will be able to function (if set).
      # Each component can overwrite these default values by adding its own resources
      # block in the relevant section below and setting the desired resources values.
      defaultResources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi

      imagePullSecrets:
       - regcred

      proxy:
        # Resources for the sidecar.
        resources:
          requests:
            cpu: 40m
            memory: 64Mi
          limits:
            cpu: 80m
            memory: 128Mi


metrics-server:
  enabled: true
  imagePullSecrets:
    - name: "regcred"

kiali:
  enabled: true
  auth:
    strategy: anonymous
  deployment:
    cluster_wide_access: true
    image_pull_secrets:
      - regcred
  external_services:
    prometheus:
      url: http://stornx-deps-prometheus-server.stornx.svc.cluster.local:80
    istio:
      root_namespace: stornx
      component_namespaces:
        istiod: stornx
        prometheus: stornx