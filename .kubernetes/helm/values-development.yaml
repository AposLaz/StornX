# Development values for StornX Helm chart
# Use: helm install stornx . -f values-development.yaml

replicaCount: 1

image:
  repository: alazidis/stornx
  pullPolicy: Always
  tag: "1.1.0"

imagePullSecrets:
  - name: regcred

config:
  env: development
  appPort: 3000
  namespaces: "default"
  prometheusUrl: "http://stornx-prometheus-server"
  cronjobExpression: "* * * * *"  # Every minute for faster feedback
  localityLabelsCron: "* * * * *"
  metricsType: "memory"
  metricsUpperThreshold: "60"
  metricsLowerThreshold: "10"
  responseTimeThreshold: "100"
  cpuWeight: "50"
  memoryWeight: "50"
  # -- OptiBalancer tuning parameters
  # These tune traffic shifting behavior. Leave the defaults if you are unsure.
  balancer:
    minDelta: "5"
    minStepSize: "5"
    maxStepSize: "20"
    urgencyThreshold: "50"
    epsilon: "1"
  faultTolerance:
    ftMaxZones: "3"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 5

startupProbe:
  enabled: false

persistence:
  enabled: false

kube-netlag:
  enabled: true
  imagePullSecrets:
    - name: "regcred"
      
prometheus:
  enabled: true
  imagePullSecrets:
    - name: "regcred"

istiod:
  enabled: true
  _internal_defaults_do_not_set:
    global:
      imagePullSecrets:
       - regcred

kiali:
  enabled: true
  deployment:
    image_pull_secrets:
      - regcred
