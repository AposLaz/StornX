name: Release Helm Chart

on:
    push:
        branches:
            - main
        paths:
            - ".kubernetes/helm/**"
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configure Git
              run: |
                  git config user.name "$GITHUB_ACTOR"
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                  version: v3.14.0

            - name: Package Helm Chart
              run: |
                  mkdir -p .helm-releases
                  helm package .kubernetes/helm -d .helm-releases

            - name: Checkout gh-pages branch
              uses: actions/checkout@v4
              with:
                  ref: gh-pages
                  path: gh-pages
              continue-on-error: true

            - name: Create gh-pages branch if not exists
              run: |
                  if [ ! -d "gh-pages" ]; then
                    mkdir gh-pages
                    cd gh-pages
                    git init
                    git checkout -b gh-pages
                  fi

            - name: Update Helm repo index
              run: |
                  cp .helm-releases/*.tgz gh-pages/ 2>/dev/null || true
                  if [ -f gh-pages/index.yaml ]; then
                    helm repo index gh-pages --url https://aposlaz.github.io/StornX --merge gh-pages/index.yaml
                  else
                    helm repo index gh-pages --url https://aposlaz.github.io/StornX
                  fi

            - name: Push to gh-pages
              run: |
                  cd gh-pages
                  git config user.name "$GITHUB_ACTOR"
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
                  git add .
                  git commit -m "Update Helm chart repository" || echo "No changes to commit"
                  git push origin gh-pages --force || git push --set-upstream origin gh-pages --force
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
