name: Package independent Helm chart
on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options: [optiscaler, optibalancer]
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - name: Validate and package selected chart
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          helm lint "deploy/$SERVICE" --set config.clusterId=validation --set existingSecret=validation
          helm package "deploy/$SERVICE" --destination .release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: stornx-${{ inputs.service }}-chart
          path: .release-artifacts/*.tgz
