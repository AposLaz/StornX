name: Release Helm Chart

on:
    push:
        branches:
            - main
        paths:
            - ".kubernetes/helm/**"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                  version: v3.14.0

            - name: Package Helm Chart
              run: |
                  mkdir -p .helm-releases
                  helm package .kubernetes/helm -d .helm-releases

            # Fetch the existing index.yaml from gh-pages so `helm repo index --merge`
            # can append the new chart version without losing previous releases.
            - name: Fetch existing Helm index
              run: |
                  mkdir -p .helm-publish
                  cp .helm-releases/*.tgz .helm-publish/
                  curl -fsSL https://aposlaz.github.io/StornX/index.yaml \
                      -o .helm-publish/index.yaml.existing || true

            - name: Generate Helm repo index
              run: |
                  if [ -f .helm-publish/index.yaml.existing ]; then
                    helm repo index .helm-publish \
                      --url https://aposlaz.github.io/StornX \
                      --merge .helm-publish/index.yaml.existing
                    rm .helm-publish/index.yaml.existing
                  else
                    helm repo index .helm-publish \
                      --url https://aposlaz.github.io/StornX
                  fi

            - name: Publish to gh-pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./.helm-publish
                  # Preserve Docusaurus website files that live on gh-pages
                  # alongside the Helm chart artifacts.
                  keep_files: true
                  user_name: "github-actions[bot]"
                  user_email: "41898282+github-actions[bot]@users.noreply.github.com"
                  commit_message: "chore: release Helm chart (${{ github.sha }})"
