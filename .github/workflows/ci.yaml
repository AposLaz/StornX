name: Continuous Integration
on:
  push:
    branches: [main]
    paths:
      [
        'services/**',
        'packages/**',
        'deploy/**',
        'scripts/**',
        'tests/**',
        'package.json',
        'yarn.lock',
        'tsconfig.base.json',
        'jest.config.cjs',
        '.github/workflows/**',
      ]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  services:
    uses: ./.github/workflows/services.yaml
