name: Validate independent services
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env: { POSTGRES_USER: test_admin, POSTGRES_PASSWORD: test_password, POSTGRES_DB: stornx }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_admin -d stornx"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1.8-management
        env: { RABBITMQ_DEFAULT_USER: test_admin, RABBITMQ_DEFAULT_PASS: test_password }
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      ENV: development
      CLUSTER_ID: integration
      BROKER_ADMIN_URL: amqp://test_admin:test_password@localhost:5672
      TEST_RABBITMQ_URL: amqp://test_admin:test_password@localhost:5672
      TEST_DATABASE_URL: postgres://test_admin:test_password@localhost:5432/stornx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.3', cache: yarn, cache-dependency-path: yarn.lock }
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn audit:runtime
      - run: yarn test
      - run: yarn format:check
      - run: node scripts/provision-broker.mjs
      - run: yarn test:integration
      - run: helm lint deploy/optiscaler --set config.clusterId=validation --set existingSecret=validation
      - run: helm lint deploy/optibalancer --set config.clusterId=validation --set existingSecret=validation
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [optiscaler, optibalancer] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: stornx-${{ matrix.service }}:validation
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: stornx-${{ matrix.service }}:validation
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
